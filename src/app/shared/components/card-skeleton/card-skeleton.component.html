<div class="card-skeleton-grid">
  @for (tarjeta of tarjetas; track tarjeta) {
    <div class="card-skeleton">
      <div class="card-skeleton__header">
        <div class="card-skeleton__avatar"></div>
        <div class="card-skeleton__lines">
          <div class="card-skeleton__bar card-skeleton__bar--title"></div>
          <div class="card-skeleton__bar card-skeleton__bar--subtitle"></div>
        </div>
      </div>
      <div class="card-skeleton__badges">
        <div class="card-skeleton__badge"></div>
        <div class="card-skeleton__badge"></div>
      </div>
    </div>
  }
</div>
