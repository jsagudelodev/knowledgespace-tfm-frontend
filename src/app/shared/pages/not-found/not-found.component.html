<div class="not-found-page">
  <app-empty-state
    icon="search_off"
    title="Página no encontrada"
    subtitle="La dirección a la que intentas acceder no existe o se movió."
    size="lg"
  >
    <button type="button" class="btn-volver" (click)="volver()">
      <span class="material-symbols-outlined icon-sm">arrow_back</span>
      Volver al inicio
    </button>
  </app-empty-state>
</div>
