<div class="chat-list-container">

  <!-- ── Header ─────────────────────────────────── -->
  <div class="list-header">
    <button class="btn-back" (click)="goToDashboard()">
      <span class="material-symbols-outlined icon-sm">arrow_back</span>
      <span>Dashboard</span>
    </button>
    <h2 class="list-title">Conversaciones</h2>
    <button class="btn-new" (click)="createConversation()">
      <span class="material-symbols-outlined icon-sm">add</span>
      <span>Nueva</span>
    </button>
  </div>

  <!-- ── Loading ────────────────────────────────── -->
  @if (loading()) {
    <div class="list-loading">
      <span class="spinner"></span>
      <span>Cargando...</span>
    </div>

  <!-- ── Empty ──────────────────────────────────── -->
  } @else if (conversations().length === 0) {
    <app-empty-state size="sm" icon="forum" title="Sin conversaciones aún" subtitle="Crea una para empezar" />

  <!-- ── List ───────────────────────────────────── -->
  } @else {
    <ul class="conversations-list">
      @for (conv of conversations(); track conv.id) {
        <li
          class="conversation-item"
          [class.active]="activeId() === conv.id"
          (click)="openConversation(conv.id)"
          (keydown.enter)="openConversation(conv.id)"
          role="button"
          tabindex="0"
          [attr.aria-current]="activeId() === conv.id ? 'page' : null"
        >
          <div class="conv-main">
            <div class="conv-icon">
              <span class="material-symbols-outlined icon-sm">forum</span>
            </div>
            <span class="conv-title">{{ conv.title }}</span>
          </div>
          <time class="conv-date">{{ conv.created_at | date:'d MMM, HH:mm' }}</time>
        </li>
      }
    </ul>
  }

</div>
