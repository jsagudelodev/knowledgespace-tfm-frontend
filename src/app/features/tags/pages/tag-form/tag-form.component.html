<!-- Cargando (solo en edición mientras se obtienen los datos) -->
@if (loading() && isEditMode && !nameValue) {
  <div class="form-loading">
    <span class="material-symbols-outlined spin">progress_activity</span>
    <span>Cargando etiqueta...</span>
  </div>
}

<!-- Banner de error -->
@if (error()) {
  <div class="form-error">
    <span class="material-symbols-outlined icon-sm">error</span>
    <span>{{ error() }}</span>
  </div>
}

<!-- Formulario -->
@if (!loading() || !isEditMode) {
  <form [formGroup]="tagForm" (ngSubmit)="onSubmit()" class="tag-form">

    <!-- ── Nombre ───────────────────────────────────────────────────────── -->
    <div class="form-group">
      <label for="name">Nombre <span class="required">*</span></label>
      <div class="input-icon-wrapper">
        <span class="material-symbols-outlined icon-sm input-icon">label</span>
        <input
          id="name"
          type="text"
          formControlName="name"
          placeholder="Ej: Urgente, Legal, Revisión..."
          [class.is-invalid]="isFieldInvalid('name')"
          autocomplete="off"
        />
      </div>
      @if (isFieldInvalid('name')) {
        <span class="field-error">{{ getErrorMessage('name') }}</span>
      }
    </div>

    <!-- ── Color ────────────────────────────────────────────────────────── -->
    <div class="form-group">
      <label for="color">
        <span class="material-symbols-outlined icon-sm label-icon">palette</span>
        Color
      </label>
      <div class="color-picker-row">
        <input id="color" type="color" formControlName="color" class="color-input" />
        <span
          class="color-preview-pill"
          [style.background]="colorValue + '22'"
          [style.color]="colorValue"
        >
          <span class="dot" [style.background]="colorValue"></span>
          {{ nameValue || 'Vista previa' }}
        </span>
      </div>
    </div>

    <!-- ── Acciones ─────────────────────────────────────────────────────── -->
    <div class="form-actions">
      <button type="button" class="btn-secondary" (click)="onCancel()">Cancelar</button>
      <button type="submit" class="btn-primary" [disabled]="loading()">
        @if (loading()) {
          <span class="material-symbols-outlined icon-sm spin">progress_activity</span>
        } @else {
          <span class="material-symbols-outlined icon-sm">save</span>
        }
        {{ isEditMode ? 'Guardar Cambios' : 'Crear Etiqueta' }}
      </button>
    </div>

  </form>
}
